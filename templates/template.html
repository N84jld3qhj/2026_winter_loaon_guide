<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>{{TITLE}}</title>
    <!-- no-flash theme: MUST run before stylesheet so dark readers never see a white flash on navigation -->
     <!-- 파비콘: 로아 공식 아이콘 -->
    <link rel="icon" href="https://cdn-lostark.game.onstove.com/2018/obt/assets/images/common/icon/favicon.ico?v=20260918100221">

    <!-- 링크 공유 미리보기 (카카오톡/디스코드/트위터 등) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="로스트아크 뉴비·복귀 유저를 위한 2026 윈터 가이드" />
    <meta property="og:image" content="https://n84jld3qhj.github.io/2026_winter_loaon_guide/images/og-image.png" />
    <meta property="og:url" content="https://n84jld3qhj.github.io/2026_winter_loaon_guide/" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
        (function () {
            try {
                var s = localStorage.getItem('theme');
                var d = s ? s : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', d);
            } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
        })();
    </script>
    <script>
    (function () {
        try {
            var bgEnabled = localStorage.getItem('bgImageEnabled') !== '0';
            if (!bgEnabled) document.documentElement.classList.add('bg-hidden');
            var imgs = {{BG_IMAGES}};
            if (!imgs || !imgs.length) return;
            var key = 'bgImage';

            // 새로고침인지 판별 (Navigation Timing API, 구형 브라우저는 legacy API로 폴백)
            var navType = 'navigate';
            var entries = performance.getEntriesByType && performance.getEntriesByType('navigation');
            if (entries && entries.length) {
                navType = entries[0].type; // 'navigate' | 'reload' | 'back_forward'
            } else if (performance.navigation) {
                navType = performance.navigation.type === 1 ? 'reload' : 'navigate';
            }

            var chosen = navType === 'reload' ? null : sessionStorage.getItem(key);
            if (!chosen || imgs.indexOf(chosen) === -1) {
                chosen = imgs[Math.floor(Math.random() * imgs.length)];
            }
            sessionStorage.setItem(key, chosen);
            document.documentElement.style.setProperty('--page-bg-image', 'url("' + chosen + '")');
        } catch (e) { /* 조용히 무시 — 기본 배경색으로 폴백 */ }
    })();
</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>

<body data-page="{{PAGEKIND}}">


    <!-- [수정됨] 공식 가이드 스타일의 Flexbox 레이아웃 컨테이너 -->
    <div class="container layout-{{PAGEKIND}}">
        <!-- Zone A: 좌측 고정 목차 (사이드바) -->
        <nav class="sidebar rail-left" id="railLeft" aria-label="전역 목차">
            <div class="gnb__header">
        <h1 class="gnb__bi">
            <a href="index.html" class="gnb__bi-link">
                <img src="https://cdn-lostark.game.onstove.com/2018/obt/assets/images/common/guide/bi-lostark.png" alt="Lostark">
            </a>
        </h1>
    </div>
            <button class="search-trigger search-trigger--rail" data-search-open aria-label="검색 열기">
                <span class="search-ico" aria-hidden="true">🔍</span><span class="search-label">검색</span><kbd class="search-kbd">⌘K</kbd>
            </button>
            <div class="spine" aria-label="섹션 0–9">
                {{SPINE}}
            </div>
            <div class="spine-progress" aria-hidden="true"><span id="progressBar"></span></div>
        </nav>

        <!-- Zone: 본문 (우측 전체 확장 영역) -->
        <main class="contents main-content" id="content">
            <!-- 화면 우상단 고정 토글 (상단바가 없어진 자리를 대신함) -->
            <button class="theme-toggle" id="themeToggle" aria-label="라이트/다크 테마 전환">
                <span class="theme-ico theme-ico--sun" aria-hidden="true">☀</span>
                <span class="theme-ico theme-ico--moon" aria-hidden="true">☾</span>
            </button>
            <button class="theme-toggle" id="bgToggle" aria-label="배경 이미지 켜기/끄기" title="배경 이미지 켜기/끄기 (테스트용)">🖼</button>
            {{CONTENT}}
        </main>
    </div>

    <!-- ⌘K 커맨드 팔레트 -->
    <!-- ⌘K 커맨드 팔레트 -->
    <dialog class="search-dialog" id="searchDialog" aria-label="가이드 검색">
        <form class="search-form" method="dialog">
            <span class="search-dialog-ico" aria-hidden="true">🔍</span>
            <input type="search" id="searchInput" class="search-input" placeholder="섹션·항목 검색…" autocomplete="off" aria-label="검색어" />
            <button type="submit" class="search-close" aria-label="닫기">esc</button>
        </form>
        <ul class="search-results" id="searchResults" role="listbox"></ul>
        <p class="search-empty" id="searchEmpty" hidden>결과가 없습니다.</p>
    </dialog>

    {{SCRIPTS}}
</body>

</html>
